<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REC Edge - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Neobrutalism styling for the edge dashboard */
        body {
            background-color: #fdfbf7;
            font-family: 'Courier New', Courier, monospace;
        }
        .neo-box {
            border: 3px solid #000;
            box-shadow: 6px 6px 0px #000;
            background-color: white;
            transition: all 0.2s ease-in-out;
        }
        .neo-button {
            background-color: #fca311;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            font-weight: bold;
        }
        .neo-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center p-4">

    <div class="neo-box max-w-md w-full p-8 rounded-lg flex flex-col items-center">
        <h1 class="text-3xl font-black mb-2 uppercase tracking-tighter">REC Edge Node</h1>
        <p class="text-sm font-bold mb-8 uppercase text-gray-600">Photographer Local Gateway</p>
        
        {% if error %}
        <div class="bg-red-200 border-2 border-black w-full p-3 mb-6 text-sm font-bold">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="w-full space-y-5">
            <div>
                <label class="block font-bold mb-2 uppercase text-sm">Photographer ID</label>
                <input type="text" name="email" required class="w-full p-3 border-2 border-black focus:outline-none focus:ring-2 focus:ring-black" placeholder="admin@rec.com" value="admin">
            </div>
            
            <div>
                <label class="block font-bold mb-2 uppercase text-sm">Password</label>
                <input type="password" name="password" required class="w-full p-3 border-2 border-black focus:outline-none focus:ring-2 focus:ring-black" placeholder="••••••••" value="admin">
            </div>
            
            <button type="submit" class="neo-button w-full py-4 mt-4 uppercase tracking-widest text-lg">Authenticate & Connect</button>
        </form>
        
        <div class="mt-8 text-xs font-bold text-gray-500 uppercase flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse block"></span> Secure Edge-to-Cloud Link Active
        </div>
    </div>

</body>
</html>
