
services:
  # ─────────────────────────────────────────────
  # EDGE NODE SERVICES
  # ─────────────────────────────────────────────
  camera-controller:
    build:
      context: ./edge-node
      dockerfile: Dockerfile
    command: python -m camera.controller
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    volumes:
      - capture-buffer:/capture-buffer
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CAMERA_BUFFER_DIR=/capture-buffer
    depends_on:
      - redis
    restart: unless-stopped

  detection-engine:
    build:
      context: ./edge-node
      dockerfile: Dockerfile
    command: python -m detection.engine
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - camera-controller
    restart: unless-stopped

  capture-orchestrator:
    build:
      context: ./edge-node
      dockerfile: Dockerfile
    command: python -m orchestrator.main
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_URL=http://api-gateway:8000
      - API_TOKEN=${EDGE_API_TOKEN}
    depends_on:
      - detection-engine
      - camera-controller
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # CLOUD BACKEND SERVICES
  # ─────────────────────────────────────────────
  api-gateway:
    build:
      context: ./cloud-api
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://rec:${DB_PASSWORD}@postgres:5432/rec
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-rec-images}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  embedding-worker:
    build:
      context: ./cloud-api
      dockerfile: Dockerfile
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://rec:${DB_PASSWORD}@postgres:5432/rec
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-rec-images}
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  celery-beat:
    build:
      context: ./cloud-api
      dockerfile: Dockerfile
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://rec:${DB_PASSWORD}@postgres:5432/rec
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rec
      POSTGRES_USER: rec
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rec"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb local/$${MINIO_BUCKET} || true;
      mc anonymous set public local/$${MINIO_BUCKET} || true;
      "
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-rec-images}

  # ─────────────────────────────────────────────
  # USER PORTAL
  # ─────────────────────────────────────────────
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api-gateway
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # MONITORING
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  grafanadata:
  capture-buffer:
